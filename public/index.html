<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Command Interface</title>
</head>
<body>
    <h1>WebSocket Command Interface</h1>
    <textarea id="cmdInput" rows="4" cols="50" placeholder="Type your command here..."></textarea><br>
    <button id="sendCmd">Send Command</button>
    <hr>
    <h2>Command Output</h2>
    <pre id="output"></pre>
    <script>
        const cmdInput = document.getElementById('cmdInput');
        const sendCmdButton = document.getElementById('sendCmd');
        const output = document.getElementById('output');

        // Connect to WebSocket server on port 5555
        const ws = new WebSocket(`ws://localhost:5555/ws1`);

        ws.onopen = () => {
            console.log('Connected to WebSocket server on port 5555');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            output.textContent += `stdout:\n${data.stdout}\nstderr:\n${data.stderr}\n\n`;
        };

        sendCmdButton.onclick = () => {
            const command = cmdInput.value;
            ws.send(command);
        };

        // Connect to WebSocket server on port 8888 for viewing
        const viewerWs = new WebSocket(`ws://localhost:8888/ws2`);
        viewerWs.onopen = () => {
            console.log('Connected to WebSocket server on port 8888');
        };

        viewerWs.onmessage = (event) => {
            const message = event.data;
            console.log(`Viewer received: ${message}`);
        };
    </script>
</body>
</html>
