<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        #output { background-color: #333; color: #fff; padding: 10px; height: 300px; overflow-y: auto; }
        #command { width: 100%; padding: 10px; }
        #send { padding: 10px; background-color: #5cb85c; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin Control Panel</h1>
    <div id="output"></div>
    <input type="text" id="command" placeholder="Enter command">
    <button id="send">Send</button>

    <script>
        const ws = new WebSocket(`ws://${window.location.hostname}:5555`);

        ws.onmessage = (event) => {
            const output = document.getElementById('output');
            output.innerHTML += event.data + '<br>';
            output.scrollTop = output.scrollHeight;
        };

        document.getElementById('send').onclick = () => {
            const command = document.getElementById('command').value;
            ws.send(command);
            document.getElementById('command').value = '';
        };
    </script>
</body>
</html>
